# Публікація сайту інструкції на GitHub Pages.
#
# configure-pages з enablement: true сам увімкне Pages у репозиторії, тому
# нічого не треба тиснути в Settings — достатньо, щоб репозиторій існував
# і був публічним (на безкоштовному плані Pages лише для публічних).
name: Deploy guide to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
